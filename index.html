<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F7">
<meta name="color-scheme" content="light">
<title>Apps de la clínica</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Estándar visual de las PWA (Material 3, estilo Mornye) – 16 nov 2026 */
:root{--vino:#8E4953;--cont:#FFD9DD;--cont-txt:#3B0713;--fondo:#FFF8F7;--tarjeta:#F8ECEC;--tarjeta2:#F0DEDF;--txt:#22191A;--sec:#534345;
  --m3:cubic-bezier(.2,0,0,1);--m3in:cubic-bezier(.05,.7,.1,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--txt);font:16px/1.45 "Google Sans Flex","Roboto Flex",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100dvh}
:focus-visible{outline:3px solid var(--vino);outline-offset:2px}
.todo{max-width:1040px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.cabeza{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cabeza img{width:52px;height:52px;display:block;flex:none}
h1{margin:4px 8px 2px;font-size:28px;line-height:36px;font-weight:700;letter-spacing:-.3px}
.sub{margin:0 8px;font-size:14px;color:var(--sec);font-variant-numeric:tabular-nums}
/* Cuadrícula de íconos, como la pantalla de inicio del celular: todo cabe sin bajar */
.grilla{margin-top:26px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 6px;background:var(--tarjeta);border-radius:28px;padding:24px 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;text-decoration:none;color:inherit;border-radius:20px;padding:4px 2px;
  transition:transform 250ms var(--m3),background 200ms;animation:entra 450ms var(--m3in) both}
.app:active{transform:scale(.94)}
.app img{width:64px;height:64px;border-radius:50%}
.app b{font-size:13.5px;line-height:1.25;font-weight:500}
@keyframes entra{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.instalar{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:360px;margin:28px auto 0;height:56px;border-radius:28px;border:0;
  background:var(--cont);color:var(--cont-txt);font:inherit;font-size:15.5px;font-weight:600;cursor:pointer;transition:transform 250ms var(--m3)}
.instalar:active{transform:scale(.97)}
.instalar[hidden]{display:none}
.instalar svg{width:20px;height:20px}
.nota{text-align:center;color:var(--sec);font-size:13px;margin-top:14px}
@media (min-width:700px){
  .todo{max-width:880px;padding:40px 32px}
  .grilla{grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 8px;padding:32px 16px}
  .app img{width:76px;height:76px}
  .app b{font-size:15px}
}
@media (hover:hover){.app:hover{background:var(--tarjeta2)}.instalar:hover{background:#FFC9CF}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="todo">
  <div class="cabeza">
    <div><h1>Apps de la clínica</h1>
      <p class="sub"><span id="fecha"></span> · <span id="hora"></span></p></div>
    <img src="logo-crc.png" alt="Clínica Reina Catalina">
  </div>
  <main id="contenido"></main>
</div>

<script>
'use strict';
/* Lista de apps del portal. Para agregar o quitar una, edita solo esta lista. */
const GRUPOS = [
  { titulo: 'Rondas', apps: [
    { nombre: 'Control de cilindros', detalle: 'Ronda diaria de cilindros', url: '/Control-de-cilindros-/', icono: 'iconos/cilindros.png' },
    { nombre: 'Ronda de tomas', detalle: 'Tomas de gases por piso', url: '/Ronda-Diaria-/', icono: 'iconos/ronda.png' }
  ]},
  { titulo: 'Inventarios', apps: [
    { nombre: 'Inventario de cilindros', detalle: 'Propios y de Messer', url: '/Inventario-de-cilindros/', icono: 'iconos/inv-cilindros.png' },
    { nombre: 'Material de gases', detalle: 'Acoples, tomas, mangueras', url: '/Inventario-Gases/', icono: 'iconos/inv-gases.png' }
  ]},
  { titulo: 'Monitoreo y proyectos', apps: [
    { nombre: 'Tanques criogénicos', detalle: 'Nivel y recargas', url: '/Tanques-criogenicos/', icono: 'iconos/tanques.png' },
    { nombre: 'Alarmas de gases', detalle: 'Levantamiento por estar', url: '/Alarmas-de-gases/', icono: 'iconos/alarmas.png' }
  ]},
  { titulo: 'Administración', apps: [
    { nombre: 'Verificar ronda', detalle: 'Código o QR del reporte', url: '/verificar.html', icono: 'iconos/verificar.png' }
  ]}
];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let k = 0;
document.getElementById('contenido').innerHTML =
  '<nav class="grilla" aria-label="Apps">' + GRUPOS.map(g => g.apps.map(a =>
    `<a class="app" href="${esc(a.url)}" title="${esc(a.detalle)}" style="animation-delay:${(k++) * 40}ms"><img src="${esc(a.icono)}" alt="" width="64" height="64"><b>${esc(a.nombre)}</b></a>`).join('')).join('') + '</nav>' +
  `<button class="instalar" id="bInstalar" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M12 7v7m-3-3 3 3 3-3"/></svg>Instalar el portal</button>
   <p class="nota">Cada app pide su propio código de acceso.</p>`;

/* Botón de instalar: aparece solo cuando el navegador lo permite */
let evInstalar = null;
const bI = document.getElementById('bInstalar');
addEventListener('beforeinstallprompt', e => { e.preventDefault(); evInstalar = e; bI.hidden = false; });
bI.onclick = async () => { if (!evInstalar) return; evInstalar.prompt(); await evInstalar.userChoice; evInstalar = null; bI.hidden = true; };
addEventListener('appinstalled', () => { bI.hidden = true; });

/* Fecha y hora de Colombia */
function reloj() {
  const z = { timeZone: 'America/Bogota' };
  const f = new Date().toLocaleDateString('es-CO', Object.assign({ weekday: 'long', day: 'numeric', month: 'long' }, z)).replace(',', '');
  document.getElementById('fecha').textContent = f.charAt(0).toUpperCase() + f.slice(1);
  document.getElementById('hora').textContent = new Date().toLocaleTimeString('es-CO', Object.assign({ hour: 'numeric', minute: '2-digit', hour12: true }, z))
    .replace(/a\.?\s?m\.?/i, 'a. m.').replace(/p\.?\s?m\.?/i, 'p. m.');
}
reloj(); setInterval(reloj, 15000);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
</html>
