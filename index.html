<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBFA">
<meta name="color-scheme" content="light">
<title>Apps de la clínica</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png?v=20261117">
<link rel="apple-touch-icon" href="icon-192.png?v=20261117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..900&display=swap" rel="stylesheet">
<style>
/* PixelUI: copia fiel de Mornye (18 nov 2026). Superficies neutras. */
:root{--vino:#84303F;--cont:#FFCCD4;--cont-txt:#33030F;--fondo:#FFFBFA;--alta:#EEE6E7;--alta2:#E7DCDD;--txt:#160D0E;--sec:#45343A;
  --m3:cubic-bezier(.2,0,0,1);--m3in:cubic-bezier(.05,.7,.1,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--txt);font:560 16px/1.45 "Google Sans Flex",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100dvh}
:focus-visible{outline:3px solid var(--vino);outline-offset:2px}
.todo{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
/* Encabezado como Mornye: logo a la izquierda, acción a la derecha, título grande con aire */
.arriba{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 4px}
.arriba img{width:40px;height:40px;display:block}
.icono{width:48px;height:48px;border-radius:24px;border:0;background:none;color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform 150ms var(--m3),background 350ms var(--m3)}
.icono[hidden]{display:none}
.icono svg{width:24px;height:24px}
.icono:active{transform:scale(.97);background:var(--alta)}
h1{margin:36px 8px 4px;font-size:34px;line-height:42px;font-weight:860;letter-spacing:-.3px}
.sub{margin:0 8px;font-size:15px;line-height:22px;color:var(--sec);font-variant-numeric:tabular-nums}
/* Secciones con título negro y accesos directos en dos columnas */
h2{margin:24px 8px 10px;font-size:20px;line-height:28px;font-weight:660}
.grupo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.app{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px;border-radius:24px;background:var(--alta);text-decoration:none;color:inherit;
  transition:transform 150ms var(--m3),background 350ms var(--m3);animation:entra 450ms var(--m3in) both}
.app:active{transform:scale(.97)}
.app img{width:40px;height:40px;border-radius:50%;flex:none}
.app span{min-width:0}
.app b{display:block;font-size:15px;line-height:20px;font-weight:660}
.app small{display:block;font-size:13px;line-height:18px;color:var(--sec);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.nota{text-align:center;color:var(--sec);font-size:13px;margin-top:24px}
@media (min-width:1024px){
  /* PC: el portal ocupa casi toda la pantalla, con tarjetas grandes */
  .todo{max-width:none;width:min(94vw,1800px);padding:3vh 0 4vh}
  .arriba img{width:56px;height:56px}
  h1{font-size:clamp(40px,3.4vw,60px);line-height:1.15;margin-top:3vh}
  .sub{font-size:clamp(17px,1.25vw,22px);line-height:1.4}
  h2{font-size:clamp(22px,1.6vw,30px);line-height:1.3;margin:4vh 8px 14px}
  .secciones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:3vw}
  .grupo{gap:16px}
  .app{min-height:clamp(130px,20vh,240px);padding:clamp(18px,1.6vw,30px);gap:clamp(16px,1.4vw,26px);border-radius:32px}
  .app img{width:clamp(64px,5vw,96px);height:clamp(64px,5vw,96px)}
  .app b{font-size:clamp(19px,1.45vw,26px);line-height:1.25}
  .app small{font-size:clamp(15px,1.05vw,19px);line-height:1.35;white-space:normal}
  .nota{font-size:16px;margin-top:4vh}
}
}
@media (hover:hover){.app:hover{background:var(--alta2)}.icono:hover{background:var(--alta)}}
/* Aviso de versión nueva */
.snack{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:auto;z-index:20;display:flex;align-items:center;gap:8px;
  background:#382E2F;color:#FCEBEC;border-radius:16px;padding:8px 8px 8px 18px;font-size:15px;opacity:0;transform:translateY(16px);pointer-events:none;
  transition:opacity 200ms var(--m3),transform 450ms var(--m3in)}
.snack.on{opacity:1;transform:none;pointer-events:auto}
.snack span{flex:1}
.snack button{border:0;background:none;color:#FFB3BB;font:inherit;font-weight:860;min-height:44px;padding:0 14px;border-radius:22px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="todo">
  <div class="arriba"><img src="logo-crc.png" alt="Clínica Reina Catalina"><button class="icono" id="bInstalar" hidden aria-label="Instalar el portal" title="Instalar el portal"><svg viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M480-337q-8 0-15-2.5t-13-8.5L308-492q-12-12-11.5-28t11.5-28q12-12 28.5-12.5T365-549l75 75v-286q0-17 11.5-28.5T480-800q17 0 28.5 11.5T520-760v286l75-75q12-12 28.5-11.5T652-548q11 12 11.5 28T652-492L508-348q-6 6-13 8.5t-15 2.5ZM240-160q-33 0-56.5-23.5T160-240v-80q0-17 11.5-28.5T200-360q17 0 28.5 11.5T240-320v80h480v-80q0-17 11.5-28.5T760-360q17 0 28.5 11.5T800-320v80q0 33-23.5 56.5T720-160H240Z"/></svg></button></div>
  <h1>Apps de la clínica</h1>
  <p class="sub"><span id="fecha"></span> · <span id="hora"></span></p>
  <main id="contenido"></main>
</div>
<div class="snack" id="nuevaVer" role="status"><span>Hay una versión nueva del portal</span><button type="button" onclick="location.reload()">Actualizar</button></div>

<script>
'use strict';
/* Lista de apps del portal. Para agregar o quitar una, edita solo esta lista. */
const GRUPOS = [
  { titulo: 'Rondas', apps: [
    { nombre: 'Control de cilindros', detalle: 'Ronda diaria de cilindros', url: '/Control-de-cilindros-/', icono: 'iconos/cilindros.png' },
    { nombre: 'Ronda de tomas', detalle: 'Tomas de gases por piso', url: '/Ronda-Diaria-/', icono: 'iconos/ronda.png' }
  ]},
  { titulo: 'Inventarios', apps: [
    { nombre: 'Inventario de cilindros', detalle: 'Propios y de Messer', url: '/Inventario-de-cilindros/', icono: 'iconos/inv-cilindros.png' },
    { nombre: 'Material de gases', detalle: 'Acoples, tomas, mangueras', url: '/Inventario-Gases/', icono: 'iconos/inv-gases.png' }
  ]},
  { titulo: 'Monitoreo y proyectos', apps: [
    { nombre: 'Tanques criogénicos', detalle: 'Nivel y recargas', url: '/Tanques-criogenicos/', icono: 'iconos/tanques.png' },
    { nombre: 'Alarmas de gases', detalle: 'Levantamiento por estar', url: '/Alarmas-de-gases/', icono: 'iconos/alarmas.png' }
  ]},
  { titulo: 'Administración', apps: [
    { nombre: 'Verificar ronda', detalle: 'Código o QR del reporte', url: '/verificar.html', icono: 'iconos/verificar.png' }
  ]}
];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let k = 0;
document.getElementById('contenido').innerHTML =
  '<nav class="secciones" aria-label="Apps">' + GRUPOS.map(g => `<section><h2>${esc(g.titulo)}</h2><div class="grupo">` + g.apps.map(a =>
    `<a class="app" href="${esc(a.url)}" style="animation-delay:${(k++) * 50}ms"><img src="${esc(a.icono)}" alt="" width="40" height="40"><span><b>${esc(a.nombre)}</b><small>${esc(a.detalle)}</small></span></a>`).join('') + '</div></section>').join('') + '</nav>' +
  '<p class="nota">Cada app pide su propio código de acceso.</p>';

/* Botón de instalar: aparece solo cuando el navegador lo permite */
let evInstalar = null;
const bI = document.getElementById('bInstalar');
addEventListener('beforeinstallprompt', e => { e.preventDefault(); evInstalar = e; bI.hidden = false; });
bI.onclick = async () => { if (!evInstalar) return; evInstalar.prompt(); await evInstalar.userChoice; evInstalar = null; bI.hidden = true; };
addEventListener('appinstalled', () => { bI.hidden = true; });

/* Fecha y hora de Colombia */
function reloj() {
  const z = { timeZone: 'America/Bogota' };
  const f = new Date().toLocaleDateString('es-CO', Object.assign({ weekday: 'long', day: 'numeric', month: 'long' }, z)).replace(',', '');
  document.getElementById('fecha').textContent = f.charAt(0).toUpperCase() + f.slice(1);
  document.getElementById('hora').textContent = new Date().toLocaleTimeString('es-CO', Object.assign({ hour: 'numeric', minute: '2-digit', hour12: true }, z))
    .replace(/a\.?\s?m\.?/i, 'a. m.').replace(/p\.?\s?m\.?/i, 'p. m.');
}
reloj(); setInterval(reloj, 15000);

/* Versión nueva: se revisa al volver a abrir el portal y se avisa para actualizar */
if ('serviceWorker' in navigator) {
  const habia = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => { }); });
  }).catch(() => { });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!habia) return;
    document.getElementById('nuevaVer').classList.add('on');
  });
}
</script>
</body>
</html>
